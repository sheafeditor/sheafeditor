name: CI

# **No trigger on a push to `main`, deliberately, and this is the one to read before adding it back.**
#
# `main` is pushed many times a day, and every push ran this workflow. That is a duplicate: the
# full `npm run gates -- --all` is re-run on the exact landing tree before anything reaches
# `main`, so by the time a push happens the same 38 gates have already passed on the same bytes.
# What CI adds over that is a clean clone and `npm ci` from the lockfile, which is real and is
# not worth a run per push.
#
# The cost was not theoretical. This account's 2,000 included Actions minutes ran out on
# 2026-10-17 with fifteen days of the cycle left, and a run here is roughly a quarter of an
# hour. A private repository spends from that allowance; a public one would not.
#
# `pull_request` stays, because a pull request is a deliberate request to be checked and that
# is the place a red run is useful. `workflow_dispatch` stays, because asking for a run is
# cheap when somebody wants one.
#
# **Measured, so that neither trigger is read as coverage it does not provide: this repository
# has never had a pull request.** Over 1,350 commits on `main` there are zero `Merge pull
# request` commits and zero `(#nnn)` subjects, which are the two shapes a merged and a
# squash-merged pull request leave. The 31 merge commits are the integrator's own `Land <branch>`
# merges, made locally and pushed. So under the process as it stands — one session merges
# branches in its checkout and pushes `main` — **`pull_request` cannot fire, and this workflow
# now runs only when somebody asks for it by hand.**
#
# It is written down because "`pull_request` stays" reads like a retained safety net, and here
# it is a door nobody has ever walked through.
#
# **A release still needs a run of this workflow, and that is the cost of dropping the push
# trigger.** `npm run release:check` refuses to proceed unless this workflow passed on the exact
# commit being released, and it has no local substitute by design: releases have failed on
# defects that only show on the Linux runner, a keyboard chord among them, which a run on a
# developer's Mac cannot reproduce. So before a cut, run this workflow by hand on the commit with
# **Run workflow**, wait for green, and then cut. That is one run per release rather than one per
# push, which is what saves the minutes.
#
# An earlier version of this comment said `release:check` was a local equivalent of this job. It
# is not: it reads this job's result and stops without it. Corrected rather than left, because it
# was the reason given for removing the push trigger, and somebody relying on it would find the
# release blocked on the day they tried to cut one.
#
# **A scheduled weekly run was considered and declined.** It would cost about 48 minutes a month
# against the 2,000 and would restore an automatic clean-clone check. It was declined because a
# scheduled run can go red exactly the way the push trigger did, which is the thing being
# avoided. If clean-clone drift starts being found on the day of a cut, this is the cheapest way
# to get the signal back.
on:
  pull_request:
  workflow_dispatch:

# Read-only, so the token every step of this job sees, `npm ci` and its three hundred
# packages included, cannot write to the repository. Without this the job inherits the
# repository default, which is read-write unless somebody changed it.
permissions:
  contents: read

jobs:
  build:
    name: Type-check, test, package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same command a change passes before it lands, rather than a subset of it. Each step
      # is labelled in the log, and the summary line says how many of them ran.
      #
      # `--all` runs every gate rather than stopping at the first failure, which is the whole
      # difference between CI and a terminal. Nobody is waiting at a prompt here, and the run is
      # the only record, so a run that stops early hides every gate behind the failure for as long
      # as that failure lives. From 2026-09-23 to 2026-09-30 every run on this branch died at gate
      # 9 of 23 and fourteen gates went dark for a week. One of them pressed a macOS-only chord
      # and reported the product broken, which failed three release cuts, and CI could not have
      # caught it: the gate was nineteen positions behind a failure that had nothing to do with it.
      # Locally the gates still stop at the first failure, which is right for the edit-run loop.
      #
      # The private-terms list lives outside the repository on purpose, because a term that is
      # private in itself cannot be listed in a file that ships. A runner has no private checkout
      # beside this one, so that step can never run here, and a step that cannot run fails the
      # gates by default. This forgives that one step by name rather than forgiving every skip:
      # a browser-driven check skipping is a real gap and has to keep failing.
      #
      # `Demo host` is forgiven for the same reason and not a weaker one: it reads the website's
      # demo page out of the `sheaf-site` checkout, which is a different repository, so a runner
      # that clones this one can never have it and that step can never run here. It is a real gate
      # on this machine, where both checkouts sit beside each other.
      - name: Gates
        env:
          SHEAF_ALLOW_SKIPPED_GATES: Private terms,Demo host
        run: npm run gates -- --all

      # Catches bundling errors and .vscodeignore regressions that the
      # type-checker and unit tests cannot see.
      - name: Package extension
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sheafeditor-vsix
          path: '*.vsix'
          if-no-files-found: error
