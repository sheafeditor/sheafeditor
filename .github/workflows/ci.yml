name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only, so the token every step of this job sees, `npm ci` and its three hundred
# packages included, cannot write to the repository. Without this the job inherits the
# repository default, which is read-write unless somebody changed it.
permissions:
  contents: read

jobs:
  build:
    name: Type-check, test, package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same command a change passes before it lands, rather than a subset of it.
      # `npm test` is the eight offline suites; the gates are those plus the docs check,
      # the scenario-id check, the 733 jsdom editor scenarios, the rendered corpus and
      # the touch layout, and they cost under two minutes altogether. Each step is
      # labelled in the log and the run stops at the first failure, so a type error
      # still fails as fast as it did when it had a step of its own.
      # The private-terms list lives outside the repository on purpose, because a term that is
      # private in itself cannot be listed in a file that ships. A runner has no private
      # checkout beside this one, so that step can never run here, and a step that cannot run
      # fails the gates by default. This forgives that one step by name rather than forgiving
      # every skip: the five browser-driven checks also skip on a runner, and those are a real
      # gap that has to keep failing.
      - name: Gates
        env:
          SHEAF_ALLOW_SKIPPED_GATES: Private terms
        run: npm run gates

      # Catches bundling errors and .vscodeignore regressions that the
      # type-checker and unit tests cannot see.
      - name: Package extension
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sheafeditor-vsix
          path: '*.vsix'
          if-no-files-found: error
