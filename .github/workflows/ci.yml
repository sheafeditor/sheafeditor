name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Type-check, test, package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check-types

      - name: Test
        run: npm test

      # Catches bundling errors and .vscodeignore regressions that the
      # type-checker and unit tests cannot see.
      - name: Package extension
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: sheafeditor-vsix
          path: '*.vsix'
          if-no-files-found: error
