name: Release

# Fires on a version tag, which only a person can push. Nothing here runs on an
# ordinary commit, so cutting a release stays a deliberate act.
#
# The point of building here rather than on a laptop: an extension registry
# ships a bundled esbuild artifact, not source, so reading the repo tells you
# nothing about what is actually inside the extension you installed. A CI build
# with an attestation ties the published .vsix back to a specific commit and
# workflow, which anyone can check with `gh attestation verify`.
on:
  push:
    tags: ['v*']
  # Dry run: builds and attests, but creates no release and publishes nothing.
  workflow_dispatch:

# One release at a time. Two tags pushed close together, or a dispatch during a tag
# run, would otherwise publish twice. Queued rather than cancelled: stopping a run
# midway through publishing to two registries is worse than waiting for it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release and upload the .vsix
  id-token: write # mint the OIDC token the attestation is signed against, and the one exchanged for a Marketplace sign-in
  attestations: write # record the provenance attestation

jobs:
  release:
    name: Build, attest, publish
    runs-on: ubuntu-latest
    # The Marketplace identity trusts this repository's `release` environment,
    # so the OIDC token's subject is `repo:<owner>/<repo>:environment:release`
    # for a tag and a dry run alike. Without an environment the subject names
    # the tag, and every version would need its own federated credential.
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # A tag that disagrees with package.json publishes a version nobody asked
      # for, and leaves the attestation naming a release that does not exist.
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      # People who watch the repository for releases receive the release notes
      # and nothing else, so the notes are the version's CHANGELOG.md entry.
      # Checked before the build so a tag with no entry fails before anything
      # is published.
      - name: Extract the release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: node scripts/changelog-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Install dependencies
        run: npm ci

      # Publishing is gated on this passing, and on the whole of it rather than on the
      # eight offline suites `npm test` runs. The docs check, the scenario-id check, the
      # 733 jsdom editor scenarios, the rendered corpus and the touch layout were all
      # outside this step, so a release could go out without any of them, for under two
      # minutes of runner time. What no workflow can gate is the real-window suite,
      # because a runner has no screen, so nothing here says whether the commit being
      # published was ever driven through a window.
      # No gates here. They run twice otherwise: `npm run release:check` runs exactly these,
      # on a clone of this commit, before the tag is pushed, and `ci.yml` runs them again on
      # every push to main, which is where the Linux coverage belongs.
      #
      # Running them here as well cost three release builds in one evening. Each failed at the
      # gates for a different reason and each left a tag pushed with nothing published: a
      # changelog guard that could not pass after a release stamped it, a skipped step that no
      # runner could ever run, and a check pressing Cmd on a machine that has no Cmd. None of
      # those was the extension being wrong, and all of them surfaced at the worst moment.
      #
      # What a tag needs from a runner is the thing only a runner can do: build the artefact,
      # attest it, and publish it. A commit's correctness is settled before the tag exists.

      - name: Package extension
        run: npm run package

      - name: Locate the VSIX
        id: vsix
        run: echo "path=$(ls sheafeditor-*.vsix)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: ${{ steps.vsix.outputs.path }}

      # The attestation is stored by GitHub and `gh attestation verify` finds it
      # without this file. It is attached anyway so the release is verifiable
      # offline, and by anyone who would rather not hand GitHub the query.
      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.vsix.outputs.path }}" \
            "${{ steps.attest.outputs.bundle-path }}#provenance.sigstore.json" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      # The Marketplace publish signs in with Microsoft Entra ID through this
      # workflow's OIDC token, so no Marketplace secret is stored anywhere. The
      # identity's client and tenant IDs are not secrets; they live in the
      # AZURE_CLIENT_ID and AZURE_TENANT_ID variables, repository or `release`
      # environment. Inert until both are set, so the workflow can be exercised
      # end to end before anything reaches the Marketplace.
      #
      # This runs on a dry run too, so a workflow_dispatch proves the sign-in
      # works before a tag depends on it.
      - name: Sign in to Microsoft Entra ID
        if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != ''
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The identity publishes extensions and owns no Azure resources.
          allow-no-subscriptions: true

      # A dry run prints the identity's Marketplace ID, which is what the
      # publisher's member list asks for, and says whether the identity can
      # already publish as `sheafeditor`. Neither outcome fails the dry run.
      - name: Show the Marketplace identity
        if: github.ref_type != 'tag' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != ''
        run: |
          if ! az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query '{id: id, displayName: displayName}'; then
            echo 'The Azure DevOps profile lookup failed; see the error above.'
          fi
          if npx vsce verify-pat --azure-credential sheafeditor; then
            echo 'This identity can publish as sheafeditor.'
          else
            echo 'This identity cannot publish as sheafeditor yet. Add the id above to the publisher as a Contributor.'
          fi

      # --packagePath publishes the exact file that was attested above. Letting
      # vsce repackage here would upload a second, unattested build and undo the
      # whole point of this workflow.
      - name: Publish to the Marketplace
        if: github.ref_type == 'tag' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != ''
        run: npx vsce publish --azure-credential --no-dependencies --packagePath "${{ steps.vsix.outputs.path }}"

      # Fallback for a release cut before the Entra identity is set up. Azure
      # DevOps retires global personal access tokens, the only kind the
      # Marketplace accepts, on 2026-12-01, and this path stops working then.
      # Delete the VSCE_PAT secret and these two steps after that date.
      #
      # The `secrets` context cannot be read from a step `if:`, so the presence
      # of the token becomes a step output the condition below can see. This
      # keeps the secret scoped to the two steps that need it rather than
      # putting it in the job environment.
      - name: Check for a Marketplace token (retires 2026-12-01)
        id: pat
        if: vars.AZURE_CLIENT_ID == '' || vars.AZURE_TENANT_ID == ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No Entra identity (AZURE_CLIENT_ID, AZURE_TENANT_ID) and no VSCE_PAT secret; skipping the Marketplace publish.'
          fi

      - name: Publish to the Marketplace with a token (retires 2026-12-01)
        if: github.ref_type == 'tag' && steps.pat.outputs.present == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies --packagePath "${{ steps.vsix.outputs.path }}"

      # Editors built on Code OSS cannot reach the Marketplace, so a release
      # that stops there reaches VS Code and nothing else. Open VSX is the
      # registry Kiro, Cursor, Windsurf and VSCodium query instead.
      #
      # Same secrets-context dance as above, for the same reason.
      - name: Check for an Open VSX token
        id: ovsx_pat
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No OVSX_PAT secret set; skipping the Open VSX publish.'
          fi

      # --packagePath again: both registries get the byte-identical file the
      # attestation above was issued against, so one `gh attestation verify`
      # covers a download from either.
      #
      # This needs the `sheafeditor` namespace to already exist on Open VSX.
      # Claiming it is a one-time manual step (`npx ovsx create-namespace
      # sheafeditor`) and it requires a signed Eclipse Publisher Agreement, so
      # the token cannot be created without a person doing that first.
      - name: Publish to Open VSX
        if: github.ref_type == 'tag' && steps.ovsx_pat.outputs.present == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish --packagePath "${{ steps.vsix.outputs.path }}"
